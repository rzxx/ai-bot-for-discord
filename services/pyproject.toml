[project]
name = "discord-voice-speech"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "num2words>=0.5.14,<1", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
